<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>家計拠出＆お小遣い計算</title>
  <style>
    body {
      font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
      margin: 0;
      background: #fff;
      color: #111;
    }
    .wrap {
      max-width: 520px;
      margin: 0 auto;
      padding: 16px;
    }
    h1 {
      font-size: 20px;
      margin-bottom: 12px;
    }
    .card {
      border: 1px solid #e5e5e5;
      border-radius: 16px;
      padding: 14px;
    }
    .row {
      display: grid;
      grid-template-columns: 160px 1fr;
      gap: 10px;
      align-items: center;
      margin-bottom: 10px;
    }
    label {
      font-size: 13px;
      color: #333;
    }
    input[type="number"] {
      width: 100%;
      padding: 10px 12px;
      font-size: 16px;
      border: 1px solid #ddd;
      border-radius: 10px;
    }
    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    .toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 10px 0;
      font-size: 13px;
    }
    .result {
      margin-top: 12px;
      background: #fafafa;
      border: 1px solid #e5e5e5;
      border-radius: 14px;
      padding: 12px;
    }
    .kv {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
      border-bottom: 1px dashed #ddd;
    }
    .kv:last-child {
      border-bottom: none;
    }
    .k {
      font-size: 13px;
      color: #444;
    }
    .v {
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }
    .err {
      color: #b00020;
      font-size: 13px;
      margin-top: 8px;
    }
    button {
      margin-top: 12px;
      padding: 10px 14px;
      font-size: 15px;
      border-radius: 12px;
      border: 1px solid #ddd;
      background: #fff;
    }
    textarea {
      width: 100%;
      margin-top: 12px;
      min-height: 140px;
      padding: 10px;
      font-size: 13px;
      border-radius: 12px;
      border: 1px solid #ddd;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>手取り → 家計拠出＆お小遣い計算</h1>

    <div class="card">
      <div class="row">
        <label>当月手取り（net）</label>
        <input id="net" type="number" min="0" />
      </div>
      <div class="row">
        <label>平均手取り（avg）</label>
        <input id="avg" type="number" min="0" value="375419" />
      </div>
      <div class="row">
        <label>最低お小遣い</label>
        <input id="allow" type="number" min="0" value="50000" />
      </div>
      <div class="row">
        <label>超過分の家計配分率</label>
        <input id="rate" type="number" min="0" max="1" step="0.01" value="0.5" />
      </div>

      <div class="toggle">
        <input id="roundOn" type="checkbox" checked />
        <label for="roundOn">拠出額を1,000円単位で四捨五入</label>
      </div>

      <div class="result">
        <div class="kv"><div class="k">家計拠出額</div><div class="v" id="contrib">—</div></div>
        <div class="kv"><div class="k">手元（お小遣い＋余剰）</div><div class="v" id="pocket">—</div></div>
        <div class="kv"><div class="k">平均差分（net-avg）</div><div class="v" id="diff">—</div></div>
        <div class="kv"><div class="k">超過分の家計追加額</div><div class="v" id="extra">—</div></div>
      </div>

      <div class="err" id="err" style="display:none;"></div>

      <button id="copyBtn">結果をコピー</button>
      <textarea id="out" readonly></textarea>
    </div>
  </div>

<script>
  const yen = n => n.toLocaleString("ja-JP") + "円";
  const netEl = document.getElementById("net");
  const avgEl = document.getElementById("avg");
  const allowEl = document.getElementById("allow");
  const rateEl = document.getElementById("rate");
  const roundOnEl = document.getElementById("roundOn");

  const contribEl = document.getElementById("contrib");
  const pocketEl = document.getElementById("pocket");
  const diffEl = document.getElementById("diff");
  const extraEl = document.getElementById("extra");
  const errEl = document.getElementById("err");
  const outEl = document.getElementById("out");

  function round1000(v) {
    return Math.round(v / 1000) * 1000;
  }

  function compute() {
    const net = Number(netEl.value);
    const avg = Number(avgEl.value);
    const allowance = Number(allowEl.value);
    const rate = Number(rateEl.value);

    if ([net, avg, allowance, rate].some(v => Number.isNaN(v)) || rate < 0 || rate > 1) {
      errEl.style.display = "block";
      errEl.textContent = "入力値を正しく入力してください。";
      return;
    }
    errEl.style.display = "none";

    const base = avg - allowance;
    const excess = Math.max(0, net - avg);
    const extra = excess * rate;

    let contrib = base + extra;
    if (roundOnEl.checked) contrib = round1000(contrib);

    const pocket = net - contrib;

    contribEl.textContent = yen(contrib);
    pocketEl.textContent = yen(pocket);
    diffEl.textContent = yen(net - avg);
    extraEl.textContent = yen(extra);

    outEl.value =
`【当月 家計拠出・手元】
・当月手取り：${yen(net)}
・家計拠出額：${yen(contrib)}
・手元：${yen(pocket)}
・平均差分：${yen(net - avg)}
・超過分按分（家計追加）：${yen(extra)}`;
  }

  ["input", "change"].forEach(ev => {
    netEl.addEventListener(ev, compute);
    avgEl.addEventListener(ev, compute);
    allowEl.addEventListener(ev, compute);
    rateEl.addEventListener(ev, compute);
    roundOnEl.addEventListener(ev, compute);
  });

  document.getElementById("copyBtn").onclick = async () => {
    if (!outEl.value) return;
    await navigator.clipboard.writeText(outEl.value);
    alert("コピーしました");
  };
</script>
</body>
</html>
