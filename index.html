<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>家計拠出＆お小遣い計算</title>
  <style>
    body {
      font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
      margin: 0;
      background: #fff;
      color: #111;
    }
    .wrap { max-width: 520px; margin: 0 auto; padding: 16px; }
    h1 { font-size: 20px; margin: 0 0 12px; }
    .card { border: 1px solid #e5e5e5; border-radius: 16px; padding: 14px; }
    .row {
      display: grid;
      grid-template-columns: 160px 1fr;
      gap: 10px;
      align-items: center;
      margin-bottom: 10px;
    }
    label { font-size: 13px; color: #333; }
    input[type="number"], input[type="text"] {
      width: 100%;
      padding: 10px 12px;
      font-size: 16px;
      border: 1px solid #ddd;
      border-radius: 10px;
      background: #fff;
    }
    input[readonly] { background: #f7f7f7; color:#333; }
    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }

    .seg {
      display:flex; gap: 10px; margin: 8px 0 14px;
      background:#f4f4f4; border:1px solid #e5e5e5; border-radius: 14px; padding: 6px;
    }
    .seg label{
      flex:1; display:flex; justify-content:center; align-items:center;
      padding:10px 0; border-radius: 12px; cursor:pointer;
      font-size: 14px; color:#222;
      user-select:none;
    }
    .seg input { display:none; }
    .seg input:checked + span {
      background:#111; color:#fff;
      border-radius: 12px;
      padding:10px 0;
      width:100%;
      text-align:center;
      display:block;
    }
    .seg span { width:100%; text-align:center; display:block; }

    .toggle { display:flex; align-items:center; gap:8px; margin: 10px 0; font-size: 13px; }
    .result {
      margin-top: 12px;
      background: #fafafa;
      border: 1px solid #e5e5e5;
      border-radius: 14px;
      padding: 12px;
    }
    .kv { display:flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px dashed #ddd; }
    .kv:last-child { border-bottom:none; }
    .k { font-size: 13px; color:#444; }
    .v { font-weight: 600; font-variant-numeric: tabular-nums; }
    .err { color:#b00020; font-size: 13px; margin-top: 8px; }
    button {
      margin-top: 12px;
      padding: 10px 14px;
      font-size: 15px;
      border-radius: 12px;
      border: 1px solid #ddd;
      background: #fff;
      cursor: pointer;
    }
    textarea {
      width: 100%;
      margin-top: 12px;
      min-height: 160px;
      padding: 10px;
      font-size: 13px;
      border-radius: 12px;
      border: 1px solid #ddd;
    }
    .hint { font-size: 12px; color:#666; margin-top: 8px; line-height: 1.4; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>手取り → 家計拠出＆手元</h1>

    <div class="card">
      <!-- しょうご／かな 切替 -->
      <div class="seg" role="tablist" aria-label="利用者選択">
        <label>
          <input type="radio" name="who" id="whoShogo" value="shogo" checked />
          <span>しょうご</span>
        </label>
        <label>
          <input type="radio" name="who" id="whoKana" value="kana" />
          <span>かな</span>
        </label>
      </div>

      <!-- 入力は当月手取りのみ -->
      <div class="row">
        <label>当月手取り（net）</label>
        <input id="net" type="number" min="0" inputmode="numeric" placeholder="例：400000" />
      </div>

      <!-- 固定（編集不可） -->
      <div class="row">
        <label>平均手取り（avg）</label>
        <input id="avg" type="text" readonly />
      </div>
      <div class="row">
        <label>最低お小遣い</label>
        <input id="allow" type="text" readonly />
      </div>
      <div class="row">
        <label>超過分の家計配分率</label>
        <input id="rate" type="text" readonly />
      </div>

      <div class="toggle">
        <input id="roundOn" type="checkbox" checked />
        <label for="roundOn">拠出額を1,000円単位で四捨五入</label>
      </div>

      <div class="result">
        <div class="kv"><div class="k">家計拠出額</div><div class="v" id="contrib">—</div></div>
        <div class="kv"><div class="k">手元（お小遣い＋余剰）</div><div class="v" id="pocket">—</div></div>
        <div class="kv"><div class="k">平均差分（net-avg）</div><div class="v" id="diff">—</div></div>
        <div class="kv"><div class="k">超過分の家計追加額</div><div class="v" id="extra">—</div></div>
      </div>

      <div class="err" id="err" style="display:none;"></div>

      <button id="copyBtn">結果をコピー</button>
      <textarea id="out" readonly></textarea>

      <div class="hint">
        計算式：contrib = (avg - allowance) + max(0, net - avg) * rate ／ pocket = net - contrib（丸めON時は contrib を丸めてから pocket 再計算）
      </div>
    </div>
  </div>

<script>
  // 固定パラメータ
  const CONFIG = {
    shogoAvg: 375419,
    kanaAvg: 194420,
    allowance: 50000,
    rate: 0.5
  };
  const LS_KEY = "pocket-single-v1";

  const yen = n => n.toLocaleString("ja-JP") + "円";
  const pct = n => (n * 100).toFixed(0) + "%";
  const round1000 = v => Math.round(v / 1000) * 1000;

  const $ = id => document.getElementById(id);
  const whoShogo = $("whoShogo");
  const whoKana  = $("whoKana");
  const netEl = $("net");
  const avgEl = $("avg");
  const allowEl = $("allow");
  const rateEl = $("rate");
  const roundOnEl = $("roundOn");

  const contribEl = $("contrib");
  const pocketEl = $("pocket");
  const diffEl = $("diff");
  const extraEl = $("extra");
  const errEl = $("err");
  const outEl = $("out");
  const copyBtn = $("copyBtn");

  function currentAvg() {
    return whoKana.checked ? CONFIG.kanaAvg : CONFIG.shogoAvg;
  }

  function syncFixedFields() {
    const avg = currentAvg();
    avgEl.value = yen(avg);
    allowEl.value = yen(CONFIG.allowance);
    rateEl.value = pct(CONFIG.rate);
  }

  function compute() {
    syncFixedFields();

    const netRaw = netEl.value.trim();
    if (!netRaw) {
      // 未入力時はダッシュ
      contribEl.textContent = "—";
      pocketEl.textContent = "—";
      diffEl.textContent = "—";
      extraEl.textContent = "—";
      outEl.value = "";
      errEl.style.display = "none";
      save();
      return;
    }

    const net = Number(netRaw);
    if (!Number.isFinite(net) || net < 0) {
      errEl.style.display = "block";
      errEl.textContent = "当月手取り（net）は0以上の数値で入力してください。";
      contribEl.textContent = "—";
      pocketEl.textContent = "—";
      diffEl.textContent = "—";
      extraEl.textContent = "—";
      outEl.value = "";
      save();
      return;
    }
    errEl.style.display = "none";

    const avg = currentAvg();
    const allowance = CONFIG.allowance;
    const rate = CONFIG.rate;

    const base = (avg - allowance);
    const excess = Math.max(0, net - avg);
    const extra = excess * rate;

    let contrib = base + extra;
    if (roundOnEl.checked) contrib = round1000(contrib);

    const pocket = net - contrib;

    contribEl.textContent = yen(contrib);
    pocketEl.textContent = yen(pocket);
    diffEl.textContent = yen(net - avg);
    extraEl.textContent = yen(extra);

    const whoLabel = whoKana.checked ? "かな" : "しょうご";
    outEl.value =
`【当月 家計拠出・手元（${whoLabel}）】
・当月手取り：${yen(net)}
・平均手取り：${yen(avg)}
・家計拠出額：${yen(contrib)}
・手元：${yen(pocket)}
・平均差分：${yen(net - avg)}
・超過分按分（家計追加）：${yen(extra)}`;

    save();
  }

  async function copy() {
    if (!outEl.value) return;
    await navigator.clipboard.writeText(outEl.value);
    const old = copyBtn.textContent;
    copyBtn.textContent = "コピーしました";
    setTimeout(() => (copyBtn.textContent = old), 1200);
  }

  function save() {
    const data = {
      who: whoKana.checked ? "kana" : "shogo",
      net: netEl.value,
      roundOn: roundOnEl.checked
    };
    localStorage.setItem(LS_KEY, JSON.stringify(data));
  }

  function load() {
    const q = new URLSearchParams(location.search);
    // URL例: ?who=shogo&net=400000
    const who = q.get("who");
    if (who === "kana") whoKana.checked = true;
    if (who === "shogo") whoShogo.checked = true;
    if (q.has("net")) netEl.value = q.get("net");
    if (q.has("round")) roundOnEl.checked = q.get("round") !== "0";

    const raw = localStorage.getItem(LS_KEY);
    if (!raw) return;
    const data = JSON.parse(raw);

    // URLが無い場合だけ復元
    if (!q.has("who") && data.who === "kana") whoKana.checked = true;
    if (!q.has("who") && data.who === "shogo") whoShogo.checked = true;
    if (!q.has("net") && typeof data.net === "string") netEl.value = data.net;
    if (!q.has("round") && typeof data.roundOn === "boolean") roundOnEl.checked = data.roundOn;
  }

  // イベント
  [whoShogo, whoKana].forEach(el => el.addEventListener("change", compute));
  netEl.addEventListener("input", compute);
  roundOnEl.addEventListener("change", compute);
  copyBtn.addEventListener("click", copy);

  // 初期化
  load();
  compute();
</script>
</body>
</html>
