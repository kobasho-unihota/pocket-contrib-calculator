<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>家計振込・お小遣い計算</title>

  <style>
    body {
      font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
      margin: 0;
      background: #fff;
      color: #111;
    }
    .wrap { max-width: 520px; margin: 0 auto; padding: 16px; }
    h1 { font-size: 20px; margin: 0 0 12px; }
    .card { border: 1px solid #e5e5e5; border-radius: 16px; padding: 14px; }

    .seg {
      display: flex; gap: 10px; margin-bottom: 14px;
      background: #f4f4f4; border: 1px solid #e5e5e5;
      border-radius: 14px; padding: 6px;
    }
    .seg label { flex: 1; cursor: pointer; text-align: center; }
    .seg input { display: none; }
    .seg span {
      display: block; padding: 10px 0; border-radius: 12px;
      font-size: 14px; color: #222;
    }
    .seg input:checked + span { background: #111; color: #fff; }

    .row {
      display: grid; grid-template-columns: 160px 1fr;
      gap: 10px; align-items: center; margin-bottom: 10px;
    }
    label { font-size: 13px; color: #333; }
    input[type="number"], input[type="text"] {
      width: 100%; padding: 10px 12px; font-size: 16px;
      border: 1px solid #ddd; border-radius: 10px;
    }
    input[readonly] { background: #f7f7f7; }
    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button {
      -webkit-appearance: none; margin: 0;
    }

    .toggle { display: flex; gap: 8px; margin: 10px 0; font-size: 13px; }

    .result {
      margin-top: 14px; background: #fafafa;
      border: 1px solid #e5e5e5; border-radius: 14px; padding: 12px;
    }
    .kv {
      display: flex; justify-content: space-between;
      padding: 6px 0; border-bottom: 1px dashed #ddd;
    }
    .kv:last-child { border-bottom: none; }
    .k { font-size: 13px; color: #444; }
    .v { font-weight: 700; font-variant-numeric: tabular-nums; }
    .main { font-size: 18px; }
    .sub { color: #555; }

    .err { color: #b00020; font-size: 13px; margin-top: 8px; }
    button {
      margin-top: 12px; padding: 10px 14px;
      font-size: 15px; border-radius: 12px;
      border: 1px solid #ddd; background: #fff;
    }
    textarea {
      width: 100%; margin-top: 12px; min-height: 170px;
      padding: 10px; font-size: 13px;
      border-radius: 12px; border: 1px solid #ddd;
    }
    .hint { font-size: 12px; color: #666; margin-top: 8px; line-height: 1.4; }
  </style>
</head>

<body>
<div class="wrap">
  <h1>手取り → 家計振込・お小遣い</h1>

  <div class="card">
    <!-- 利用者 -->
    <div class="seg">
      <label><input type="radio" name="who" id="whoShogo" checked><span>しょうご</span></label>
      <label><input type="radio" name="who" id="whoKana"><span>かな</span></label>
    </div>

    <div class="row">
      <label>当月手取り</label>
      <input id="net" type="number" min="0" placeholder="例：350000">
    </div>

    <div class="row"><label>平均手取り</label><input id="avg" type="text" readonly></div>
    <div class="row"><label>最低お小遣い</label><input id="allow" type="text" readonly></div>
    <div class="row"><label>超過分 家計配分率</label><input id="rate" type="text" readonly></div>

    <div class="toggle">
      <input id="roundOn" type="checkbox" checked>
      <label for="roundOn">家計振込額を1,000円単位で四捨五入</label>
    </div>

    <div class="result">
      <div class="kv"><div class="k">🏦 家計口座に振り込む</div><div class="v main" id="contrib">—</div></div>
      <div class="kv"><div class="k">👛 自分に残す（手元）</div><div class="v main" id="pocket">—</div></div>
      <div class="kv"><div class="k">└ 最低お小遣い</div><div class="v sub" id="allowShown">—</div></div>
      <div class="kv"><div class="k">└ 余剰</div><div class="v sub" id="surplus">—</div></div>
      <div class="kv"><div class="k">参考：平均との差</div><div class="v" id="diff">—</div></div>
      <div class="kv"><div class="k">参考：超過分の家計追加</div><div class="v" id="extra">—</div></div>
    </div>

    <div class="err" id="err" style="display:none;"></div>
    <button id="copyBtn">結果をコピー</button>
    <textarea id="out" readonly></textarea>

    <div class="hint">
      ※ 最低お小遣い 50,000円は必ず確保されます。<br>
      家計振込額は、お小遣いを下回らない範囲で自動調整されます。
    </div>
  </div>
</div>

<script>
  const CONFIG = {
    shogoAvg: 375419,
    kanaAvg: 194420,
    allowance: 50000,
    rate: 0.5
  };

  const yen = n => n.toLocaleString("ja-JP") + "円";
  const round1000 = v => Math.round(v / 1000) * 1000;

  const whoShogo = document.getElementById("whoShogo");
  const whoKana = document.getElementById("whoKana");
  const netEl = document.getElementById("net");
  const avgEl = document.getElementById("avg");
  const allowEl = document.getElementById("allow");
  const rateEl = document.getElementById("rate");
  const roundOnEl = document.getElementById("roundOn");

  const contribEl = document.getElementById("contrib");
  const pocketEl = document.getElementById("pocket");
  const allowShownEl = document.getElementById("allowShown");
  const surplusEl = document.getElementById("surplus");
  const diffEl = document.getElementById("diff");
  const extraEl = document.getElementById("extra");
  const errEl = document.getElementById("err");
  const outEl = document.getElementById("out");
  const copyBtn = document.getElementById("copyBtn");

  function currentAvg() {
    return whoKana.checked ? CONFIG.kanaAvg : CONFIG.shogoAvg;
  }

  function syncFixed() {
    avgEl.value = yen(currentAvg());
    allowEl.value = yen(CONFIG.allowance);
    rateEl.value = (CONFIG.rate * 100) + "%";
  }

  function compute() {
    syncFixed();

    const netVal = netEl.value.trim();
    if (!netVal) return;

    const net = Number(netVal);
    if (!Number.isFinite(net) || net < 0) {
      errEl.textContent = "当月手取りは0以上で入力してください。";
      errEl.style.display = "block";
      return;
    }
    errEl.style.display = "none";

    const avg = currentAvg();
    const base = avg - CONFIG.allowance;
    const excess = Math.max(0, net - avg);
    const extra = excess * CONFIG.rate;

    // 元の計算
    let contrib = base + extra;

    // 最低お小遣い保証（重要）
    contrib = Math.min(contrib, net - CONFIG.allowance);

    // 丸め
    if (roundOnEl.checked) contrib = round1000(contrib);

    // 念のため再クランプ
    contrib = Math.min(contrib, net - CONFIG.allowance);

    const pocket = net - contrib;
    const surplus = pocket - CONFIG.allowance;

    contribEl.textContent = yen(contrib);
    pocketEl.textContent = yen(pocket);
    allowShownEl.textContent = yen(CONFIG.allowance);
    surplusEl.textContent = yen(surplus);
    diffEl.textContent = yen(net - avg);
    extraEl.textContent = yen(extra);

    const whoLabel = whoKana.checked ? "かな" : "しょうご";
    outEl.value =
`【当月 家計振込・お小遣い（${whoLabel}）】
・当月手取り：${yen(net)}
・家計口座に振り込む：${yen(contrib)}
・自分に残す：${yen(pocket)}
　└ 最低お小遣い：${yen(CONFIG.allowance)}
　└ 余剰：${yen(surplus)}
（参考）平均との差：${yen(net - avg)}
（参考）超過分の家計追加：${yen(extra)}`;
  }

  [whoShogo, whoKana].forEach(el => el.addEventListener("change", compute));
  netEl.addEventListener("input", compute);
  roundOnEl.addEventListener("change", compute);

  copyBtn.onclick = async () => {
    if (!outEl.value) return;
    await navigator.clipboard.writeText(outEl.value);
    const t = copyBtn.textContent;
    copyBtn.textContent = "コピーしました";
    setTimeout(() => copyBtn.textContent = t, 1200);
  };

  syncFixed();
</script>
</body>
</html>
