<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>手取り → 家計振込・お小遣い</title>

  <style>
    /* ===== base / safety ===== */
    *, *::before, *::after { box-sizing: border-box; }
    :root{
      --bg0:#0b1020;
      --bg1:#111a33;
      --card:#ffffff;
      --muted:#6b7280;
      --text:#0f172a;
      --line:rgba(15,23,42,.10);
      --soft:rgba(15,23,42,.06);
      --shadow: 0 10px 30px rgba(2,6,23,.18);
      --shadow2: 0 6px 18px rgba(2,6,23,.12);
      --radius: 20px;
      --radius2: 16px;
    }

    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
      color: var(--text);
      background:
        radial-gradient(1200px 800px at 20% -10%, rgba(56,189,248,.35), transparent 55%),
        radial-gradient(900px 700px at 95% 10%, rgba(167,139,250,.35), transparent 50%),
        radial-gradient(900px 900px at 50% 110%, rgba(34,197,94,.22), transparent 55%),
        linear-gradient(180deg, var(--bg0), var(--bg1));
      min-height: 100dvh;
    }

    .wrap{
      max-width: 560px;
      margin: 0 auto;
      padding: 18px 14px 32px;
    }

    /* ===== header ===== */
    .top{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:12px;
      margin: 4px 2px 14px;
      color: rgba(255,255,255,.92);
    }
    .brand{
      display:flex;
      flex-direction:column;
      gap:6px;
    }
    .title{
      font-size: 20px;
      font-weight: 800;
      letter-spacing: .2px;
      line-height: 1.2;
      margin: 0;
    }
    .subtitle{
      margin: 0;
      font-size: 12px;
      color: rgba(255,255,255,.72);
      line-height: 1.4;
    }
    .pill{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding: 10px 12px;
      border-radius: 999px;
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.12);
      box-shadow: 0 1px 0 rgba(255,255,255,.06) inset;
      font-size: 12px;
      color: rgba(255,255,255,.80);
      white-space: nowrap;
      user-select:none;
    }

    /* ===== card ===== */
    .card{
      background: rgba(255,255,255,.92);
      border: 1px solid rgba(255,255,255,.20);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .card-inner{
      padding: 14px;
    }

    /* ===== segmented control ===== */
    .seg{
      display:flex;
      gap: 10px;
      padding: 8px;
      border-radius: 18px;
      background: rgba(15,23,42,.06);
      border: 1px solid var(--line);
    }
    .seg label{
      flex:1;
      cursor:pointer;
      text-align:center;
      user-select:none;
    }
    .seg input{ display:none; }
    .seg span{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      padding: 10px 0;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 700;
      color: rgba(15,23,42,.70);
      transition: transform .08s ease, background .2s ease, color .2s ease, box-shadow .2s ease;
    }
    .seg input:checked + span{
      color: #0b1220;
      background:
        radial-gradient(140px 60px at 20% 0%, rgba(56,189,248,.55), transparent 60%),
        radial-gradient(160px 70px at 90% 20%, rgba(167,139,250,.55), transparent 60%),
        linear-gradient(180deg, #fff, rgba(255,255,255,.92));
      border: 1px solid rgba(15,23,42,.10);
      box-shadow: var(--shadow2);
    }
    .seg span:active{ transform: scale(.99); }

    /* ===== form ===== */
    .form{
      margin-top: 12px;
      display:flex;
      flex-direction:column;
      gap: 10px;
    }

    .row{
      display:grid;
      grid-template-columns: 150px 1fr;
      gap: 10px;
      align-items:center;
    }
    .row > * { min-width: 0; }
    label{
      font-size: 12px;
      font-weight: 700;
      color: rgba(15,23,42,.72);
      white-space: nowrap;
    }

    .field{
      position:relative;
    }

    input[type="text"]{
      width: 100%;
      padding: 12px 12px;
      font-size: 16px;
      border-radius: 14px;
      border: 1px solid rgba(15,23,42,.14);
      background: rgba(255,255,255,.92);
      outline: none;
      box-shadow: 0 1px 0 rgba(255,255,255,.8) inset;
      transition: border-color .15s ease, box-shadow .15s ease, transform .06s ease;
    }
    input[type="text"]:focus{
      border-color: rgba(56,189,248,.75);
      box-shadow: 0 0 0 4px rgba(56,189,248,.18);
    }
    input[readonly]{
      background: rgba(15,23,42,.04);
      color: rgba(15,23,42,.70);
    }

    .toggle{
      display:flex;
      align-items:center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 16px;
      background: rgba(15,23,42,.04);
      border: 1px solid var(--line);
      font-size: 13px;
      color: rgba(15,23,42,.78);
      user-select:none;
    }
    .toggle input{
      width: 18px;
      height: 18px;
      accent-color: #0b1220;
    }

    /* ===== result ===== */
    .result{
      margin-top: 12px;
      border-radius: var(--radius2);
      border: 1px solid var(--line);
      background:
        radial-gradient(240px 120px at 5% 0%, rgba(56,189,248,.18), transparent 60%),
        radial-gradient(240px 120px at 95% 20%, rgba(167,139,250,.18), transparent 60%),
        linear-gradient(180deg, rgba(255,255,255,.95), rgba(255,255,255,.88));
      padding: 12px;
    }

    .kv{
      display:flex;
      justify-content: space-between;
      gap: 10px;
      padding: 8px 0;
      border-bottom: 1px dashed rgba(15,23,42,.14);
    }
    .kv:last-child{ border-bottom:none; }
    .k{
      font-size: 13px;
      color: rgba(15,23,42,.76);
      white-space: nowrap;
      display:flex;
      align-items:center;
      gap:8px;
    }
    .v{
      font-weight: 900;
      font-variant-numeric: tabular-nums;
      text-align: right;
      color: rgba(15,23,42,.92);
    }
    .v.main{ font-size: 22px; letter-spacing: .2px; }
    .sub{ color: rgba(15,23,42,.70); font-weight: 800; }

    .badge{
      display:inline-flex;
      align-items:center;
      gap:6px;
      font-size: 11px;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid rgba(15,23,42,.12);
      background: rgba(255,255,255,.70);
      color: rgba(15,23,42,.72);
      box-shadow: 0 1px 0 rgba(255,255,255,.7) inset;
    }

    .err{
      margin-top: 10px;
      padding: 10px 12px;
      border-radius: 14px;
      border: 1px solid rgba(220,38,38,.25);
      background: rgba(220,38,38,.08);
      color: rgba(153,27,27,.95);
      font-size: 13px;
      display:none;
    }

    /* ===== actions ===== */
    .actions{
      display:flex;
      gap: 10px;
      align-items:center;
      margin-top: 12px;
    }
    button{
      border: none;
      cursor: pointer;
      user-select:none;
      font-weight: 900;
      letter-spacing: .2px;
    }
    .btn{
      flex: 0 0 auto;
      padding: 12px 14px;
      border-radius: 14px;
      border: 1px solid rgba(15,23,42,.12);
      background:
        radial-gradient(160px 80px at 20% 0%, rgba(56,189,248,.40), transparent 60%),
        radial-gradient(180px 90px at 90% 20%, rgba(167,139,250,.42), transparent 60%),
        linear-gradient(180deg, #ffffff, rgba(255,255,255,.86));
      box-shadow: var(--shadow2);
      color: rgba(15,23,42,.92);
      transition: transform .08s ease, box-shadow .15s ease;
      white-space: nowrap;
    }
    .btn:active{ transform: translateY(1px); }

    textarea{
      width: 100%;
      margin-top: 10px;
      min-height: 160px;
      padding: 12px;
      border-radius: 16px;
      border: 1px solid rgba(15,23,42,.14);
      background: rgba(255,255,255,.90);
      font-size: 13px;
      line-height: 1.5;
      color: rgba(15,23,42,.90);
      resize: vertical;
    }

    .hint{
      margin-top: 10px;
      font-size: 12px;
      color: rgba(15,23,42,.60);
      line-height: 1.45;
    }

    /* ===== mobile tweaks ===== */
    @media (max-width: 420px){
      .row{ grid-template-columns: 120px 1fr; }
      .v.main{ font-size: 20px; }
      .title{ font-size: 19px; }
    }

    /* Reduced motion */
    @media (prefers-reduced-motion: reduce){
      *{ transition: none !important; }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="top">
      <div class="brand">
        <h1 class="title">手取り → 家計振込・お小遣い</h1>
        <p class="subtitle">「最低お小遣い 50,000円」を必ず確保。手取りはカンマ入力OK（自動整形）。</p>
      </div>
      <div class="pill" title="計算ルール">
        🔒 最低お小遣い保証
      </div>
    </div>

    <div class="card">
      <div class="card-inner">

        <!-- Segmented toggle -->
        <div class="seg" aria-label="利用者選択">
          <label>
            <input type="radio" name="who" id="whoShogo" checked />
            <span>👤 しょうご</span>
          </label>
          <label>
            <input type="radio" name="who" id="whoKana" />
            <span>👤 かな</span>
          </label>
        </div>

        <!-- Form -->
        <div class="form">
          <div class="row">
            <label for="net">当月手取り</label>
            <div class="field">
              <input id="net" type="text" inputmode="numeric" />
            </div>
          </div>

          <div class="row">
            <label>平均手取り</label>
            <div class="field">
              <input id="avg" type="text" readonly />
            </div>
          </div>

          <div class="row">
            <label>最低お小遣い</label>
            <div class="field">
              <input id="allow" type="text" readonly />
            </div>
          </div>

          <div class="row">
            <label>超過分 家計配分率</label>
            <div class="field">
              <input id="rate" type="text" readonly />
            </div>
          </div>

          <div class="toggle">
            <input id="roundOn" type="checkbox" checked />
            <label for="roundOn">家計振込額を1,000円単位で四捨五入</label>
            <span class="badge" id="roundBadge">ON</span>
          </div>
        </div>

        <!-- Result -->
        <div class="result" aria-live="polite">
          <div class="kv">
            <div class="k">🏦 家計口座に振り込む</div>
            <div class="v main" id="contrib">—</div>
          </div>
          <div class="kv">
            <div class="k">👛 自分に残す（手元）</div>
            <div class="v main" id="pocket">—</div>
          </div>
          <div class="kv">
            <div class="k">└ 最低お小遣い <span class="badge">固定</span></div>
            <div class="v sub" id="allowShown">—</div>
          </div>
          <div class="kv">
            <div class="k">└ 余剰</div>
            <div class="v sub" id="surplus">—</div>
          </div>
          <div class="kv">
            <div class="k">参考：平均との差</div>
            <div class="v" id="diff">—</div>
          </div>
          <div class="kv">
            <div class="k">参考：超過分の家計追加</div>
            <div class="v" id="extra">—</div>
          </div>
        </div>

        <div class="err" id="err"></div>

        <div class="actions">
          <button class="btn" id="copyBtn">結果をコピー</button>
          <span class="hint" id="statusHint"></span>
        </div>

        <textarea id="out" readonly></textarea>

        <div class="hint">
          計算：家計振込＝(平均−最低お小遣い)+max(0,手取り−平均)×配分率。<br>
          ただし「手元が最低お小遣いを下回らない」よう、家計振込は自動で上限調整されます。
        </div>

      </div>
    </div>
  </div>

<script>
  const CONFIG = {
    shogoAvg: 375419,
    kanaAvg: 194420,
    allowance: 50000,
    rate: 0.5
  };

  const yen = n => n.toLocaleString("ja-JP") + "円";
  const round1000 = v => Math.round(v / 1000) * 1000;

  function parseMoney(str) {
    if (str == null) return null;
    let s = String(str).trim();
    if (!s) return null;

    // 全角数字→半角
    s = s.replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0));
    // カンマ・通貨・空白除去
    s = s.replace(/[，,￥¥円\s]/g, "");

    if (!s) return null;
    const n = Number(s);
    return Number.isFinite(n) ? n : NaN;
  }

  function formatMoneyInput(n) {
    if (!Number.isFinite(n)) return "";
    return Math.round(n).toLocaleString("ja-JP");
  }

  const whoShogo = document.getElementById("whoShogo");
  const whoKana  = document.getElementById("whoKana");

  const netEl = document.getElementById("net");
  const avgEl = document.getElementById("avg");
  const allowEl = document.getElementById("allow");
  const rateEl = document.getElementById("rate");
  const roundOnEl = document.getElementById("roundOn");
  const roundBadge = document.getElementById("roundBadge");

  const contribEl = document.getElementById("contrib");
  const pocketEl  = document.getElementById("pocket");
  const allowShownEl = document.getElementById("allowShown");
  const surplusEl = document.getElementById("surplus");
  const diffEl = document.getElementById("diff");
  const extraEl = document.getElementById("extra");

  const errEl = document.getElementById("err");
  const outEl = document.getElementById("out");
  const copyBtn = document.getElementById("copyBtn");
  const statusHint = document.getElementById("statusHint");

  function currentAvg() {
    return whoKana.checked ? CONFIG.kanaAvg : CONFIG.shogoAvg;
  }

  function syncFixed() {
    avgEl.value = yen(currentAvg());
    allowEl.value = yen(CONFIG.allowance);
    rateEl.value = (CONFIG.rate * 100) + "%";
    roundBadge.textContent = roundOnEl.checked ? "ON" : "OFF";
  }

  function setDash() {
    contribEl.textContent = pocketEl.textContent = "—";
    allowShownEl.textContent = surplusEl.textContent = "—";
    diffEl.textContent = extraEl.textContent = "—";
    outEl.value = "";
    statusHint.textContent = "";
  }

  function setError(msg){
    errEl.textContent = msg;
    errEl.style.display = "block";
  }
  function clearError(){
    errEl.style.display = "none";
    errEl.textContent = "";
  }

  function compute() {
    syncFixed();

    const net = parseMoney(netEl.value);

    if (net === null) {
      clearError();
      setDash();
      return;
    }
    if (Number.isNaN(net) || net < 0) {
      setError("当月手取りは 0以上の数値で入力してください（カンマ可）。");
      setDash();
      return;
    }
    clearError();

    const avg = currentAvg();
    const base = avg - CONFIG.allowance;
    const excess = Math.max(0, net - avg);
    const extra = excess * CONFIG.rate;

    let contrib = base + extra;

    // 最低お小遣い保証：contrib <= net - allowance
    contrib = Math.min(contrib, net - CONFIG.allowance);

    // 丸め
    if (roundOnEl.checked) contrib = round1000(contrib);

    // 念のため再クランプ
    contrib = Math.min(contrib, net - CONFIG.allowance);

    const pocket = net - contrib;
    const surplus = pocket - CONFIG.allowance;

    contribEl.textContent = yen(contrib);
    pocketEl.textContent  = yen(pocket);
    allowShownEl.textContent = yen(CONFIG.allowance);
    surplusEl.textContent = yen(surplus);
    diffEl.textContent = yen(net - avg);
    extraEl.textContent = yen(extra);

    const whoLabel = whoKana.checked ? "かな" : "しょうご";
    outEl.value =
`【当月 家計振込・お小遣い（${whoLabel}）】
・当月手取り：${yen(net)}
・家計口座に振り込む：${yen(contrib)}
・自分に残す：${yen(pocket)}
　└ 最低お小遣い：${yen(CONFIG.allowance)}
　└ 余剰：${yen(surplus)}
（参考）平均との差：${yen(net - avg)}
（参考）超過分の家計追加：${yen(extra)}`;

    statusHint.textContent = "入力はカンマ自動整形されます";
  }

  function normalizeNetOnBlur(){
    const n = parseMoney(netEl.value);
    if (n === null) { netEl.value = ""; return; }
    if (Number.isNaN(n) || n < 0) return; // 不正値はそのまま
    netEl.value = formatMoneyInput(n);
  }

  // events
  [whoShogo, whoKana].forEach(el => el.addEventListener("change", compute));
  roundOnEl.addEventListener("change", compute);

  netEl.addEventListener("input", compute);
  netEl.addEventListener("blur", () => {
    normalizeNetOnBlur();
    compute();
  });

  copyBtn.onclick = async () => {
    if (!outEl.value) return;
    await navigator.clipboard.writeText(outEl.value);
    const old = copyBtn.textContent;
    copyBtn.textContent = "コピーしました ✓";
    setTimeout(() => copyBtn.textContent = old, 1200);
  };

  // init
  syncFixed();
  compute();
</script>
</body>
</html>
